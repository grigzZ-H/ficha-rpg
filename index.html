<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FICHA DE PERSONAGEM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Asap:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="topo">
        <section class="conteiner-topo">
            <div class="cnt-nomepersonagem">
                <p>Nome do personagem</p>
                <input type="text" name="" id="">
            </div>

            <div class="cnt-nomejogador">
                <p>Nome do jogador</p>
                <input type="text" name="" id="">
            </div>

            <div class="cnt-pontos de experiencia">
                <p>Ponto de experiencia</p>
                <input type="text" name="" id="">
            </div>

            <div class="cnt-raça">
                <p>Raça</p>
                <input type="text" name="" id="">
            </div>

            <div class="cnt-classe">
                <p>Classe</p>
                <input type="text" name="" id="">
            </div>

            <div class="cnt-alinhamento">
                <p>Alinhamento</p>
                <input type="text" name="" id="">
            </div>
        </section>
    </header>


    <main class="conteiner-conteudo-principal">
        <section class="sessao-conteudo-principal">
            <div class="conteiner-modificadores">
                <div class="forca">
                    <p>Força</p>
                    <input type="text" name="" id="">
                </div>

                <div class="destreza">
                    <p>Destreza</p>
                    <input type="text" name="" id="">
                </div>

                <div class="constituiçao">
                    <p>Constituição</p>
                    <input type="text" name="" id="">
                </div>

                <div class="Inteligencia">
                    <p>Inteligencia</p>
                    <input type="text" name="" id="">
                </div>

                <div class="Sabedoria">
                    <p>Sabedoria</p>
                    <input type="text" name="" id="">
                </div>

                <div class="Carisma">
                    <p>Carisma</p>
                    <input type="text" name="" id="">
                </div>
            </div>

            <div class="conteiner-vdv-img">
                <div class="conteiner-vdv">
                    <div>
                        <p>Vida</p>
                        <input type="text" name="" id="">
                    </div>

                    <div>
                        <p>Defesa</p>
                        <input type="text" name="" id="">
                    </div>

                    <div>
                        <p>Velocidade</p>
                        <input type="text" name="" id="">
                    </div>
                 </div>
                    <div class="conteiner-img">
                        <img width="100%" height="100%" src="mago.jpg" alt="imagem do mago">
                    </div>
            </div>
            <div class="conteiner-biografia">
                <h2>
                    Biografia
                </h2>
                <textarea name="" id="" cols="30" rows="25"></textarea>
            </div>
        </section>
        <section class="sessao-conteudo-secundario">
            <div class="conteiner-caracteristicas">
                <h2>
                    Caracteristicas
                </h2>
                <textarea name="" id="" cols="30" rows="25"></textarea>
            </div>
            <div class="conteiner-equipamento">
                <h2>
                    Equipamento
                </h2>
                <textarea name="" id="" cols="30" rows="25"></textarea>
            </div>
        </section>
    </main>
</body>

</html>
